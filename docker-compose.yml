services:
  api:
    image: ${IMAGE:-pypi-data-to-dolthub:latest}
    platform: ${PLATFORM:-}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-8000}/health || exit 1"]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 2s
